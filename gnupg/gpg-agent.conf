pinentry-program /usr/bin/pinentry-gnome3
allow-preset-passphrase
default-cache-ttl 1800
max-cache-ttl 7200

# Expose gpg-agent as an SSH agent as well, useful when an OpenPGP
# authentication subkey is moved to a hardware token.
enable-ssh-support

# Disable smartcard daemon probing to avoid IPC connection failures
disable-scdaemon
