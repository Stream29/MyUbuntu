# Managed from DeviceManagement/MyUbuntu/system/etc/systemd/system/fprintd.service.d/50-local-libfprint.conf
# Prefer the locally built libfprint Goodix MOC driver (12-stage tuned 27c6:6594 build)
# without overwriting apt-managed /usr/lib/x86_64-linux-gnu/libfprint-2.so.2.
[Service]
Environment="LD_LIBRARY_PATH=/usr/local/lib/libfprint-goodixmoc"
