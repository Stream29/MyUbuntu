# Managed from DeviceManagement/MyUbuntu/system/systemd/system/gdm.service.d/50-filter-non-gdm-sessions.conf
# Keep non-GDM logind sessions (such as TTY-launched Sway with SERVICE=login)
# from shadowing GDM's own display session during OpenReauthenticationChannel.
[Service]
Environment="LD_PRELOAD=/usr/local/lib/gdm-filter-non-gdm-sessions.so"
