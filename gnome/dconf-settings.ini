# Curated declarative GNOME desktop & extension settings for `dconf load /`.
#
# Intentional exclusions (not versioned here):
# - Runtime-toggled states: `org/gnome/desktop/screensaver/lock-enabled`
#   (managed dynamically by `caffeine-lock-sync`) and `caffeine/user-enabled`.
# - Sensitive or host-specific state: Wi-Fi EAP entries (`org/gnome/nm-applet`),
#   Night Light coordinates, RDP TLS paths, local wallpaper/filechooser paths,
#   app picker layout, VM UUIDs, and proxy settings.

[org/gnome/desktop/a11y]
always-show-universal-access-status=false

[org/gnome/desktop/a11y/applications]
screen-magnifier-enabled=false
screen-reader-enabled=false

[org/gnome/desktop/input-sources]
show-all-sources=true
sources=[('xkb', 'us')]
xkb-options=@as []

[org/gnome/desktop/interface]
accent-color='blue'
color-scheme='prefer-dark'
cursor-blink=true
cursor-blink-time=1000
cursor-size=24
cursor-theme='Yaru'
document-font-name='Ubuntu Sans 11'
enable-animations=true
enable-hot-corners=true
font-name='Ubuntu Sans 11'
gtk-theme='Yaru-blue-dark'
icon-theme='Yaru-blue-dark'
monospace-font-name='Ubuntu Sans Mono 10'
scaling-factor=uint32 1
show-battery-percentage=true
text-scaling-factor=1.0
toolbar-style='text'
toolkit-accessibility=true

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/desktop/peripherals/pointingstick]
accel-profile='default'
speed=-0.24145299145299148

[org/gnome/desktop/peripherals/touchpad]
click-method='areas'
two-finger-scrolling-enabled=true

[org/gnome/desktop/privacy]
report-technical-problems=false

[org/gnome/desktop/screensaver]
lock-delay=uint32 30
ubuntu-lock-on-suspend=true

[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/desktop/sound]
event-sounds=true
theme-name='ocean'

[org/gnome/desktop/wm/keybindings]
switch-group=@as []
switch-group-backward=@as []
switch-input-source=['XF86Keyboard']
switch-input-source-backward=['<Shift>XF86Keyboard']
toggle-fullscreen=['<Super>f']

[org/gnome/desktop/wm/preferences]
theme='Yaru-blue-dark'

[org/gnome/mutter]
edge-tiling=false
workspaces-only-on-primary=false

[org/gnome/mutter/keybindings]
toggle-tiled-left=@as []
toggle-tiled-right=@as []

[org/gnome/nautilus/compression]
default-compression-format='7z'

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'
show-create-link=true
show-delete-permanently=true

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Alt>s'
command='/home/stream/Applications/Snipaste/AppRun snip'
name='snip'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Shift><Alt>s'
command='/home/stream/Applications/Snipaste/AppRun snip -o clipboard'
name='snip and copy'

[org/gnome/settings-daemon/plugins/power]
power-button-action='suspend'
power-saver-profile-on-low-battery=false
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'

[org/gnome/shell]
disable-extension-version-validation=true
disable-user-extensions=false
disabled-extensions=['status-tray@keithvassallo.com']
enabled-extensions=['tiling-assistant@ubuntu.com', 'pano@elhan.io', 'clipboard-indicator@tudmotu.com', 'snapd-search-provider@canonical.com', 'web-search-provider@ubuntu.com', 'pin-window@eltaweel068', 'caffeine@patapon.info', 'ubuntu-dock@ubuntu.com', 'ubuntu-appindicators@ubuntu.com', 'ding@rastersoft.com', 'kimpanel@kde.org', 'hibernate-power-menu@arnakazim']

[org/gnome/shell/extensions/caffeine]
cli-toggle=true
enable-fullscreen=false
indicator-position-max=4
nightlight-control='never'
screen-blank='always'
show-indicator='only-active'
toggle-shortcut=['']
use-custom-duration=false

[org/gnome/shell/extensions/clipboard-indicator]
cache-size=100
history-size=200
toggle-menu=['<Super>v']

[org/gnome/shell/extensions/dash-to-dock]
dash-max-icon-size=36
dock-fixed=true
dock-position='LEFT'
multi-monitor=true
show-icons-notifications-counter=true

[org/gnome/shell/extensions/ding]
check-x11wayland=true

[org/gnome/shell/extensions/pin-window]
toggle-pin=['<Alt>t']

[org/gnome/shell/extensions/status-tray]
overflow-custom-icon='view-more-horizontal-symbolic'
overflow-enabled=true
overflow-icon-style='custom'
overflow-inline-count=0

[org/gnome/shell/extensions/tiling-assistant]
focus-hint-color='rgb(203,67,20)'
overridden-settings={'org.gnome.mutter.edge-tiling': <@mb nothing>, 'org.gnome.mutter.keybindings.toggle-tiled-left': <@mb nothing>, 'org.gnome.mutter.keybindings.toggle-tiled-right': <@mb nothing>}
tiling-popup-all-workspace=true

[org/gnome/shell/keybindings]
focus-active-notification=@as []
screenshot=@as []
screenshot-window=@as []
show-screenshot-ui=['Print']
toggle-message-tray=@as []

[org/gnome/shell/ubuntu]
startup-sound=''
