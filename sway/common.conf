# Connect Fcitx to this compositor and isolate GNOME Kimpanel by active VT.
exec /home/stream/ACodeSpace/push/DeviceManagement/MyUbuntu/bin/sway-fcitx

# Synchronize clipboard bidirectionally with GNOME session.
exec /home/stream/ACodeSpace/push/DeviceManagement/MyUbuntu/bin/sway-gnome-clipboard-sync

# Lock only this compositor; no idle timer. The listener also handles before-sleep.
exec /home/stream/ACodeSpace/push/DeviceManagement/MyUbuntu/bin/sway-session-lock watch
unbindsym Mod4+l
bindsym Mod4+l exec /home/stream/ACodeSpace/push/DeviceManagement/MyUbuntu/bin/sway-session-lock lock

# Provide a graphical Polkit authentication agent for run0 and privileged prompts in Sway.
exec /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1

# Interactive screenshot with window snapping and swappy annotation.
bindsym Mod1+s exec /home/stream/ACodeSpace/push/DeviceManagement/MyUbuntu/bin/sway-screenshot

# Use the same physical output scaling in every native Sway session.
output eDP-1 scale 1.25
output DP-1 scale 1.5

# Use the current Ubuntu wallpaper in every Sway session.
output * bg "/home/stream/Pictures/Wallpapers/在我变成你之前-first-clean2-pixel-1920x1200.png" fill

# Use the same physical touchpad behavior in every native Sway session.
input type:touchpad {
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
    scroll_method two_finger
    scroll_factor 1.0
    dwt enabled
    middle_emulation disabled
}

# Disable the SNI tray in swaybar so GNOME retains StatusNotifierWatcher, and show device status.
bar bar-0 {
    tray_output none
    status_command /home/stream/ACodeSpace/push/DeviceManagement/MyUbuntu/bin/swaybar-status
}
