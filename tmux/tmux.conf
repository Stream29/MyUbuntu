# Enable scrolling, pane selection, and pane resizing with the mouse.
set -g mouse on

# Copy mouse selections without leaving copy mode or changing the scroll position.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# Keep the native one-line status bar and open the session/window tree on left-click.
set -g status on
set -gu status-format
set -g status-left '[#S] '
set -g status-left-length 40
bind-key -T root MouseDown1StatusLeft choose-tree -Zw

# Keep the remaining native right-click menus open for a subsequent click.
run-shell '/home/stream/ACodeSpace/push/DeviceManagement/bin/tmux-sticky-menus'

# Mirror the active pane title to the outer terminal and relay focus events.
set -g set-titles on
set -g set-titles-string '#T'
set -g focus-events on

# Propagate Wayland and Sway socket variables when clients attach or refresh.
set -gu update-environment
set -ga update-environment 'WAYLAND_DISPLAY SWAYSOCK'

# Preserve modified keys such as Shift+Enter for terminal applications.
set -s extended-keys on
set -s extended-keys-format csi-u

# Persist sessions, windows, panes, working directories, and session groups.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save every 15 minutes or during a clean service shutdown; restore on server start.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Create and enable a user-level systemd service for tmux startup.
set -g @continuum-boot 'on'

# Keep TPM initialization last so continuum can retain its status hook.
run-shell '~/.config/tmux/plugins/tpm/tpm'
